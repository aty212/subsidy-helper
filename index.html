<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="補助小幫手" />
  <title>補助小幫手 — 找到適合你的社會補助</title>
  <!-- iOS 主畫面圖示：黃底＋實心金色五角星 -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23f5c518'/%3E%3Cpolygon points='90,28 105,72 152,72 115,98 128,142 90,116 52,142 65,98 28,72 75,72' fill='%23c9960c'/%3E%3C/svg%3E" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/.
  
  
  svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23f5c518'/%3E%3Cpolygon points='90,28 105,72 152,72 115,98 128,142 90,116 52,142 65,98 28,72 75,72' fill='%23c9960c'/%3E%3C/svg%3E" type="image/svg+xml" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow:      #f5c518;
      --yellow-soft: #fff8d6;
      --yellow-mid:  #fde98a;
      --yellow-dark: #c9960c;
      --bg:          #fffdf4;
      --surface:     #ffffff;
      --surface2:    #fef9e7;
      --border:      #f0e6b2;
      --border2:     #e8dda0;
      --text:        #1a1500;
      --text2:       #4a3f00;
      --muted:       #8a7a30;
      --radius:      18px;
    }

    body {
      font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.6;
      /* iOS Safari 底部安全區 */
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ══ iOS 底部 Tab Bar ══ */
    .mobile-tabbar {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 150;
      background: rgba(255,253,244,0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      display: none;
      grid-template-columns: repeat(4, 1fr);
    }
    .mobile-tabbar a {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 600; color: var(--muted);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .mobile-tabbar a .tb-icon { font-size: 22px; line-height: 1; }
    .mobile-tabbar a.active { color: var(--yellow-dark); }

    @media (max-width: 540px) {
      .mobile-tabbar { display: grid; }
      body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
      nav { padding-top: env(safe-area-inset-top); }
    }

    /* ══ NAVBAR ══ */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,253,244,0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      padding-top: env(safe-area-inset-top);
      height: calc(60px + env(safe-area-inset-top));
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo-icon {
      width: 36px; height: 36px;
      background: var(--yellow);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 2px 8px rgba(245,197,24,0.35);
    }
    .nav-logo-text { font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: 0.5px; }
    .nav-logo-sub  { font-size: 11px; color: var(--muted); }
    .nav-links { display: flex; gap: 2px; }
    .nav-links a {
      padding: 6px 14px; border-radius: 8px;
      font-size: 13px; color: var(--text2); text-decoration: none;
      transition: background 0.15s;
    }
    .nav-links a:hover { background: var(--yellow-soft); }

    /* ══ HERO ══ */
    .hero {
      max-width: 680px; margin: 0 auto;
      padding: 52px 24px 36px;
      text-align: center;
    }
    .hero-badge {
      display: inline-block;
      background: var(--yellow-soft);
      border: 1px solid var(--border2);
      border-radius: 99px;
      padding: 4px 16px;
      font-size: 12px; font-weight: 700;
      color: var(--yellow-dark);
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }
    .hero h1 {
      font-size: 34px; font-weight: 900;
      color: var(--text); line-height: 1.22;
      margin-bottom: 12px;
    }
    .hero h1 em { font-style: normal; color: var(--yellow-dark); }
    .hero p { font-size: 15px; color: var(--muted); margin-bottom: 28px; }

    /* 搜尋框 */
    .search-wrap {
      display: flex; align-items: center;
      background: var(--surface);
      border: 1.5px solid var(--border2);
      border-radius: 14px;
      padding: 10px 16px; gap: 10px;
      box-shadow: 0 2px 12px rgba(245,197,24,0.12);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-wrap:focus-within {
      border-color: var(--yellow);
      box-shadow: 0 2px 16px rgba(245,197,24,0.28);
    }
    .search-wrap input {
      flex: 1; background: none; border: none; outline: none;
      font-size: 15px; color: var(--text);
    }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-wrap button {
      background: var(--yellow); border: none; border-radius: 10px;
      padding: 8px 20px; font-size: 14px; font-weight: 700;
      color: var(--text); cursor: pointer;
      transition: background 0.15s;
    }
    .search-wrap button:hover { background: var(--yellow-mid); }

    /* 統計列 */
    .stats {
      display: flex; justify-content: center; gap: 32px;
      margin-top: 28px;
    }
    .stat-item { text-align: center; }
    .stat-item .num { font-size: 24px; font-weight: 900; color: var(--yellow-dark); }
    .stat-item .label { font-size: 12px; color: var(--muted); }

    /* ══ SECTION ══ */
    .section { max-width: 680px; margin: 0 auto; padding: 0 24px 44px; }
    .section-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 13px; font-weight: 700;
      color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase;
    }
    .section-line { flex: 1; height: 1px; background: var(--border); }

    /* ══ CATEGORY GRID ══ */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .cat-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 14px 16px;
      cursor: pointer; text-align: center;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
    }
    .cat-card:hover {
      border-color: var(--yellow);
      box-shadow: 0 4px 18px rgba(245,197,24,0.22);
      transform: translateY(-3px);
    }
    .cat-card:active { transform: translateY(-1px); }
    .cat-card .c-icon {
      font-size: 30px;
      width: 52px; height: 52px;
      background: var(--yellow-soft);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 10px;
    }
    .cat-card h3 { font-size: 14px; font-weight: 700; color: var(--text); }
    .cat-card p  { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.4; }

    /* ══ FEATURED LIST ══ */
    .subsidy-row {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px; margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .subsidy-row:hover {
      border-color: var(--yellow);
      box-shadow: 0 2px 12px rgba(245,197,24,0.18);
    }
    .subsidy-row .sr-left { display: flex; align-items: center; gap: 12px; }
    .subsidy-row .sr-tag {
      font-size: 11px; font-weight: 700;
      background: var(--yellow-soft);
      border: 1px solid var(--border2);
      border-radius: 6px; padding: 2px 8px;
      color: var(--yellow-dark); white-space: nowrap;
    }
    .subsidy-row .sr-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .subsidy-row .sr-sub  { font-size: 12px; color: var(--muted); }
    .subsidy-row .sr-arrow { color: var(--yellow-dark); font-size: 20px; flex-shrink: 0; }

    /* ══ MODAL ══ */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(26,21,0,0.45);
      z-index: 200; align-items: flex-end; justify-content: center;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      width: 100%; max-width: 680px;
      max-height: 92vh; overflow-y: auto;
      padding-bottom: 36px;
      animation: slideUp 0.22s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* 拖拉指示條 */
    .modal-handle {
      width: 40px; height: 4px;
      background: var(--border2); border-radius: 99px;
      margin: 12px auto 0;
    }

    .modal-header {
      position: sticky; top: 0;
      background: var(--surface);
      padding: 14px 20px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-header h2 { font-size: 17px; font-weight: 800; color: var(--text); }
    .modal-close {
      width: 30px; height: 30px;
      background: var(--yellow-soft); border: none; border-radius: 50%;
      color: var(--text2); font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: var(--yellow-mid); }

    /* 列表 modal */
    .modal-list-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background 0.12s;
    }
    .modal-list-item:last-child { border-bottom: none; }
    .modal-list-item:hover { background: var(--yellow-soft); }
    .modal-list-item .ml-left h3 { font-size: 15px; font-weight: 600; color: var(--text); }
    .modal-list-item .ml-left p  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .modal-list-item .ml-arrow   { color: var(--yellow-dark); font-size: 18px; }

    /* 詳情 modal header */
    .detail-hero {
      background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-mid) 100%);
      padding: 20px 22px 18px;
    }
    .detail-hero .dh-tag {
      font-size: 11px; font-weight: 700;
      background: rgba(255,255,255,0.5);
      border-radius: 6px; padding: 2px 9px;
      color: var(--text2); display: inline-block; margin-bottom: 8px;
    }
    .detail-hero h2 { font-size: 21px; font-weight: 900; color: var(--text); }
    .detail-hero p  { font-size: 13px; color: var(--text2); margin-top: 4px; }

    /* Tabs */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky; top: 0; z-index: 10;
    }
    .tab-btn {
      flex: 1; padding: 12px 4px;
      background: none; border: none;
      color: var(--muted); font-size: 13px; font-weight: 600;
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn.active { color: var(--yellow-dark); border-bottom-color: var(--yellow); }
    .tab-content { display: none; padding: 18px 20px; }
    .tab-content.active { display: block; }

    /* 詳情內容 */
    .info-block { margin-bottom: 18px; }
    .info-block h3 {
      font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 10px;
    }
    .info-block ul { list-style: none; }
    .info-block ul li {
      font-size: 14px; color: var(--text);
      padding: 7px 0; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 8px; line-height: 1.5;
    }
    .info-block ul li:last-child { border-bottom: none; }
    .info-block ul li::before { content: "▸"; color: var(--yellow-dark); flex-shrink: 0; margin-top: 2px; }

    .step-list { list-style: none; counter-reset: steps; }
    .step-list li {
      counter-increment: steps;
      font-size: 14px; color: var(--text);
      padding: 10px 0; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 12px; line-height: 1.5;
    }
    .step-list li:last-child { border-bottom: none; }
    .step-list li::before {
      content: counter(steps);
      background: var(--yellow); color: var(--text);
      font-weight: 800; font-size: 12px;
      min-width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    .doc-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--yellow-soft);
      border: 1px solid var(--border2);
      border-radius: 8px; padding: 6px 12px;
      font-size: 13px; color: var(--text2);
      margin: 0 6px 8px 0;
    }
    .doc-chip::before { content: "📄"; font-size: 12px; }

    .office-card {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
    }
    .office-card strong { color: var(--yellow-dark); display: block; margin-bottom: 3px; font-size: 14px; }
    .office-card span   { font-size: 13px; color: var(--muted); }

    /* ══ LANG ══ */
    .lang-btn {
      background: none; border: 1.5px solid var(--border2);
      border-radius: 8px; padding: 5px 10px;
      font-size: 13px; font-weight: 600; color: var(--text2);
      cursor: pointer; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .lang-btn:hover, .lang-btn.active { background: var(--yellow-soft); border-color: var(--yellow); }
    .lang-picker {
      display: none; position: absolute; top: calc(100% + 6px); right: 0;
      background: var(--surface); border: 1.5px solid var(--border2);
      border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      z-index: 300; min-width: 160px; overflow: hidden;
      animation: fadeIn 0.15s ease;
    }
    .lang-picker.open { display: block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }
    .lang-picker button {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 11px 16px;
      border: none; background: none;
      font-size: 14px; color: var(--text); cursor: pointer;
      border-bottom: 1px solid var(--border);
      text-align: left;
      -webkit-tap-highlight-color: transparent;
    }
    .lang-picker button .flag-img {
      width: 22px; height: 16px; object-fit: cover;
      border-radius: 3px; flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .lang-picker button:last-child { border-bottom: none; }
    .lang-picker button:hover { background: var(--yellow-soft); }
    .lang-picker button.cur { font-weight: 700; color: var(--yellow-dark); }
    .lang-wrap { position: relative; }

    /* ══ FOOTER ══ */
    footer {
      border-top: 1px solid var(--border);
      padding: 28px 24px;
      text-align: center;
      font-size: 12px; color: var(--muted);
    }
    footer a { color: var(--yellow-dark); text-decoration: none; }

    /* ══ MAP ══ */
    #map-container {
      width: 100%; height: 280px;
      border-radius: 14px; overflow: hidden;
      border: 1.5px solid var(--border2);
      margin-bottom: 12px;
      background: var(--yellow-soft);
    }
    .map-locate-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 13px 0;
      background: var(--yellow);
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; color: var(--text);
      cursor: pointer; margin-bottom: 14px;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .map-locate-btn:active { background: var(--yellow-mid); }
    .map-locate-btn:disabled { opacity: 0.6; }
    .map-nearest-label {
      font-size: 12px; font-weight: 700; color: var(--muted);
      letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px;
    }
    .map-place-card {
      display: flex; align-items: flex-start; gap: 12px;
      background: var(--surface2); border: 1.5px solid var(--border2);
      border-radius: 14px; padding: 14px; margin-bottom: 10px;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s;
    }
    .map-place-card:active { border-color: var(--yellow); background: #fff8d6; }
    .map-place-card .mpc-icon {
      font-size: 20px; width: 40px; height: 40px;
      background: var(--yellow-soft); border-radius: 10px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .map-place-card .mpc-name  { font-size: 14px; font-weight: 700; color: var(--text); }
    .map-place-card .mpc-addr  { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
    .map-place-card .mpc-dist  {
      font-size: 11px; font-weight: 700; color: var(--yellow-dark);
      background: var(--yellow-soft); border-radius: 6px;
      padding: 2px 8px; margin-top: 5px; display: inline-block;
    }
    .map-nav-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--yellow); border: none; border-radius: 8px;
      padding: 5px 12px; font-size: 12px; font-weight: 700;
      color: var(--text); cursor: pointer; margin-top: 6px;
      -webkit-tap-highlight-color: transparent;
    }
    .map-status {
      font-size: 13px; color: var(--muted);
      text-align: center; padding: 12px 0;
    }
    .map-info-banner {
      background: var(--yellow-soft); border: 1px solid var(--border2);
      border-radius: 10px; padding: 10px 14px;
      font-size: 13px; color: var(--text2); margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }

    /* ══ RWD ══ */
    @media (max-width: 540px) {
      .hero h1 { font-size: 26px; }
      .cat-grid { grid-template-columns: repeat(2, 1fr); }
      .nav-links { display: none; }
      .stats { gap: 20px; }
      .modal { border-radius: 20px 20px 0 0; }
      .tab-btn { font-size: 12px; padding: 11px 2px; }
      /* 增加觸控目標大小 */
      .cat-card { padding: 20px 12px 18px; min-height: 90px; }
      .subsidy-row { padding: 16px 16px; }
      .modal-list-item { padding: 16px 20px; }
    }
  </style>
  <!-- Google Maps API（使用免費 iframe Embed，不需 API Key） -->
</head>
<body>

<!-- Navbar -->
<nav>
  <a class="nav-logo" href="#">
    <div class="nav-logo-icon">🌟</div>
    <div>
      <div class="nav-logo-text">補助小幫手</div>
      <div class="nav-logo-sub">社會補助查詢平台</div>
    </div>
  </a>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="nav-links">
      <a href="#categories" data-i18n="nav_cat">補助類別</a>
      <a href="#featured"   data-i18n="nav_feat">精選補助</a>
      <a href="#hotline"    data-i18n="nav_hot">諮詢專線</a>
    </div>
    <!-- 語言切換 -->
    <div class="lang-wrap" id="lang-wrap">
      <button class="lang-btn" id="lang-btn" onclick="toggleLangPicker(event)">🌐 繁中</button>
      <div class="lang-picker" id="lang-picker">
        <button onclick="setLang('zh')"><img class="flag-img" src="https://flagcdn.com/tw.svg" alt="🇹🇼"> 繁體中文</button>
        <button onclick="setLang('en')"><img class="flag-img" src="https://flagcdn.com/us.svg" alt="🇺🇸"> English</button>
        <button onclick="setLang('vi')"><img class="flag-img" src="https://flagcdn.com/vn.svg" alt="🇻🇳"> Tiếng Việt</button>
        <button onclick="setLang('id')"><img class="flag-img" src="https://flagcdn.com/id.svg" alt="🇮🇩"> Bahasa Indonesia</button>
        <button onclick="setLang('th')"><img class="flag-img" src="https://flagcdn.com/th.svg" alt="🇹🇭"> ภาษาไทย</button>
        <button onclick="setLang('ja')"><img class="flag-img" src="https://flagcdn.com/jp.svg" alt="🇯🇵"> 日本語</button>
        <button onclick="setLang('ko')"><img class="flag-img" src="https://flagcdn.com/kr.svg" alt="🇰🇷"> 한국어</button>
      </div>
    </div>
  </div>
</nav>

<!-- iOS 底部 Tab Bar（手機用） -->
<div class="mobile-tabbar" id="mobile-tabbar">
  <a href="#categories" onclick="setTabActive(this)">
    <span class="tb-icon">🏷️</span>類別
  </a>
  <a href="#featured" onclick="setTabActive(this)">
    <span class="tb-icon">⭐</span>精選

  const hits = [];
  Object.entries(DATA).forEach(([cat, catData]) => {

/**
 * 偵測位置後，自動找最近的申請地點並顯示導航按鈕
 * officeKeywords: 此補助項目的辦理地點關鍵字（例如['各區公所社會課','社福諮詢專線']）
 */
function locateAndNavigate(officeKeywords, mapSearchQuery) {
  const btn = document.getElementById('btn-locate');
  if (!navigator.geolocation) {
    showMapStatus('❌ 無法定位，請直接點「在 Google Maps 搜尋」');
    return;
  }
  btn.disabled = true;
  btn.innerHTML = '⏳ 定位中…';
  showMapStatus('📡 正在取得您的位置，請稍候…');

  navigator.geolocation.getCurrentPosition(
    pos => {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      btn.innerHTML = '✅ 已取得位置';
      btn.disabled = false;
      document.getElementById('map-status').style.display = 'none';
      showNearestOffices(userLat, userLng, officeKeywords, mapSearchQuery);
    },
    err => {
      btn.disabled = false;
      btn.innerHTML = '📍 重試定位';
      const msgs = {1:'請允許瀏覽器存取位置', 2:'無法取得位置', 3:'定位逾時'};
      showMapStatus('❌ ' + (msgs[err.code]||'定位失敗') + ' — 請直接點「在 Google Maps 搜尋」');
    },
    { timeout: 12000, maximumAge: 30000, enableHighAccuracy: false }
  );
}

function showNearestOffices(lat, lng, keywords, mapSearchQuery) {
  let pool = OFFICE_DB;
  const isEmployment = keywords.some(k => k.includes('就業') || k.includes('勞動'));
  const isFarm       = keywords.some(k => k.includes('農會') || k.includes('農保'));

  if (isFarm)            pool = OFFICE_DB.filter(o => o.key === '農會' || o.key === '社會局');
  else if (isEmployment) pool = OFFICE_DB.filter(o => o.key === '就業服務' || o.key === '社會局');
  else                   pool = OFFICE_DB.filter(o => o.key === '社會局');

  const sorted = pool.map(o => ({
    ...o, dist: Math.round(haversine(lat, lng, o.lat, o.lng) * 10) / 10
  })).sort((a, b) => a.dist - b.dist).slice(0, 3);

  const nearest = sorted[0];
  // 帶座標的 Google Maps 搜尋，結果會以使用者位置為中心排序
  const gmapsUrl = `https://maps.google.com/maps?q=${encodeURIComponent(mapSearchQuery)}&near=${lat},${lng}&z=14`;

  const el = document.getElementById('map-nearest');
  el.innerHTML = `
    <div class="map-nearest-label">📌 距你最近的申辦地點</div>
    <a href="${gmapsUrl}" target="_blank" rel="noopener"
       style="display:flex;align-items:center;justify-content:center;gap:8px;
              background:var(--yellow);border-radius:12px;padding:14px;
              font-size:15px;font-weight:700;color:var(--text);
              text-decoration:none;margin-bottom:12px;-webkit-tap-highlight-color:transparent">
      🗺️ 在 Google Maps 搜尋「${nearest.name}附近」
    </a>` +
    sorted.map((o, i) => `
      <div class="map-place-card">
        <div class="mpc-icon">${i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉'}</div>
        <div style="flex:1">
          <div class="mpc-name">${o.name}</div>
          <div class="mpc-addr">${o.addr}</div>
          <span class="mpc-dist">📏 直線距離約 ${o.dist} 公里</span>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
            <button class="map-nav-btn"
              onclick="openGoogleMapsSearch('${o.name.replace(/'/g,"\\'")} ${o.addr.replace(/'/g,"\\'")}')">
              🔍 在地圖搜尋
            </button>
            <button class="map-nav-btn"
              onclick="openNavigation('${o.name.replace(/'/g,"\\'")}','${o.addr.replace(/'/g,"\\'")}')">
              🗺️ 導航前往
            </button>
          </div>
        </div>
      </div>`).join('');
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/** 直接在 Google Maps 搜尋關鍵字（最準確，會開啟 Maps App 或網頁版） */
function openGoogleMapsSearch(query) {
  const q = encodeURIComponent(query);
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (isIOS) {
    // 先嘗試開 Google Maps App，500ms 後 fallback 到網頁版
    window.location.href = `comgooglemaps://?q=${q}`;
    setTimeout(() => window.open(`https://maps.google.com/maps?q=${q}`, '_blank'), 500);
  } else {
    window.open(`https://maps.google.com/maps?q=${q}`, '_blank');
  }
}

/** 開啟 Google Maps 導航 */
function openNavigation(name, addr) {
  const dest = encodeURIComponent(name + ' ' + addr);
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (isIOS) {
    window.location.href = `comgooglemaps://?daddr=${dest}`;
    setTimeout(() => window.open(`https://maps.google.com/maps?daddr=${dest}`, '_blank'), 500);
  } else {
    window.open(`https://maps.google.com/maps?daddr=${dest}&travelmode=transit`, '_blank');
  }
}

function showMapStatus(msg) {
  const el = document.getElementById('map-status');
  el.innerHTML = msg;
  el.style.display = 'block';
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

let curLang = 'zh';

function t(key) { return LANGS[curLang][key] || LANGS.zh[key] || key; }

function setLang(lang) {
  curLang = lang;
  const L = LANGS[lang];
  // 語言按鈕文字
  document.getElementById('lang-btn').textContent = `🌐 ${L.label}`;
  // 關閉選單
  document.getElementById('lang-picker').classList.remove('open');
  document.getElementById('lang-btn').classList.remove('active');
  // 標記當前選中
  document.querySelectorAll('#lang-picker button').forEach(b => {
    b.classList.toggle('cur', b.textContent.trim().endsWith(L.label) || b.getAttribute('onclick') === `setLang('${lang}')`);
  });
  // 更新所有 data-i18n 元素
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (L[key] !== undefined) el.innerHTML = L[key];
  });
  // placeholder
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (L[key] !== undefined) el.placeholder = L[key];
  });
  // 更新 Section 標題
  document.querySelectorAll('[data-i18n-sec]').forEach(el => {
    const key = el.getAttribute('data-i18n-sec');
    if (L[key] !== undefined) el.textContent = L[key];
  });
  // 更新底部 Tab Bar
  const tb = document.querySelectorAll('.mobile-tabbar a');
  const tbKeys = ['mob_cat','mob_feat','mob_hot','mob_search'];
  tb.forEach((a, i) => {
    const icon = a.querySelector('.tb-icon');
    const iconText = icon ? icon.outerHTML : '';
    a.innerHTML = iconText + L[tbKeys[i]];
  });
  // 重新掛 icon
  document.querySelectorAll('.mobile-tabbar a .tb-icon').forEach((el, i) => {
    const icons = ['🏷️','⭐','📞','🔍'];
    el.textContent = icons[i];
  });
  // 更新 hotlines
  renderHotlines(lang);
  // 更新 footer
  const footer = document.querySelector('footer');
  if (footer) footer.innerHTML = L.footer_text;
  // 更新 html lang
  document.documentElement.lang = {zh:'zh-TW',en:'en',vi:'vi',id:'id',th:'th',ja:'ja',ko:'ko'}[lang] || 'zh-TW';
}

function toggleLangPicker(e) {
  e.stopPropagation();
  const picker = document.getElementById('lang-picker');
  const btn    = document.getElementById('lang-btn');
  picker.classList.toggle('open');
  btn.classList.toggle('active', picker.classList.contains('open'));
}
// 點擊其他地方關閉
document.addEventListener('click', () => {
  document.getElementById('lang-picker')?.classList.remove('open');
  document.getElementById('lang-btn')?.classList.remove('active');
});
</script>
</body>
</html>
